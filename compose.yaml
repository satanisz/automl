services:
  workspace:
    image: automl/workspace:py${PYTHON_VERSION:-3.12}-${PROFILE:-ml-standard}
    build:
      context: .
      dockerfile: docker/Dockerfile
      args:
        PYTHON_VERSION: ${PYTHON_VERSION:-3.12}
        PROFILE: ${PROFILE:-ml-standard}
    environment:
      WORKSPACE_IDE: ${WORKSPACE_IDE:-jupyter}
      WORKSPACE_AUTH_MODE: ${WORKSPACE_AUTH_MODE:-auto}
    ports:
      - "8888:8888"
      - "8080:8080"
    volumes:
      - automl-workspace:/workspace

volumes:
  automl-workspace:
